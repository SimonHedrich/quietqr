name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Pages and Release run this first, so nothing is deployed or published untested.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so callers don't cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Unit and scan tests
        run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: quietqr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container (read-only, no capabilities)
        run: |
          docker run -d --name quietqr --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 quietqr:ci
          curl --retry 10 --retry-connrefused -fsS -o /dev/null http://localhost:8080/health
          curl -fsSI http://localhost:8080/ | grep -i "content-security-policy: default-src 'none'"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test against the container
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:8080
